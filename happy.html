<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Birthday Baba!</title>
<style>
body{
  margin:0;
  padding:0;
  background:#1e3a8a;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
  text-align:center;
  overflow:hidden;
}
h1{
  font-size:3.2rem;
  color:white;
  white-space:nowrap;
  text-shadow:0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(255,255,255,0.7), 0 0 35px rgba(255,255,255,0.5);
  border-bottom:3px solid rgba(255,255,255,0.6);
  padding-bottom:10px;
  position:relative;
  animation:fadeIn 2s ease forwards, shimmer 4s infinite;
}
button{
  margin-top:30px;
  padding:15px 35px;
  background: linear-gradient(45deg, #ff4da6, #ff85d0);
  border:none;
  color:white;
  font-size:1.3rem;
  font-weight:bold;
  border-radius:12px;
  cursor:pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: transform 0.2s;
}
button:hover{
  transform: scale(1.1);
}
#flowers{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
  display:none;
}
.flower{
  position:absolute;
  width:40px;
  height:40px;
  background:url('https://i.imgur.com/ww8H4d0.png');
  background-size:cover;
  animation: fall 4s linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); opacity:0; }
}
@keyframes fadeIn { from { opacity:0; transform:translateY(-20px);} to { opacity:1; transform:translateY(0);} }
@keyframes shimmer { 0% { text-shadow:0 0 10px rgba(255,255,255,0.9);} 50% { text-shadow:0 0 20px rgba(255,255,255,1);} 100% { text-shadow:0 0 10px rgba(255,255,255,0.9);} }

.sparkle-heart { 
  position:absolute; 
  color:white; 
  font-size:1.5rem; 
  animation:float 3s ease-in-out infinite; 
}
@keyframes float { 
  0% { transform:translateY(0); opacity:1;} 
  50% { transform:translateY(-20px); opacity:0.7;} 
  100% { transform:translateY(0); opacity:1;} 
}
</style>
</head>
<body>

<h1>Happiest Birthdayy Baba !! ❣❣</h1>

<button onclick="celebrate()">Celebrate 🎉</button>

<div id="flowers"></div>

<!-- Audio -->
<audio id="song" src="birthday_clip.mp3"></audio>

<!-- Sparkling hearts -->
<span class="sparkle-heart" style="top:10px; left:20px;">❣</span>
<span class="sparkle-heart" style="top:50px; left:80%;">❣</span>
<span class="sparkle-heart" style="top:120px; left:40%;">❣</span>
<span class="sparkle-heart" style="top:200px; left:60%;">❣</span>
<span class="sparkle-heart" style="top:300px; left:30%;">❣</span>

<script>
function celebrate(){
    document.getElementById("flowers").style.display = "block";
    playFlowers();
    let song = document.getElementById("song");
    song.volume = 0.5;
    song.play().catch(e=>console.log("Autoplay blocked, click the button to start"));
}

function playFlowers(){
    let count = 0;
    let interval = setInterval(()=>{
        let f = document.createElement("div");
        f.className = "flower";
        f.style.left = Math.random()*100 + "vw";
        f.style.animationDelay = "0s";
        document.getElementById("flowers").appendChild(f);
        setTimeout(()=>f.remove(), 5000);
        count++;
        if(count>100) clearInterval(interval);
    }, 100);
}
</script>

</body>
</html>
